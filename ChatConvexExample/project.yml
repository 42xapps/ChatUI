# Regenerate ChatConvexExample.xcodeproj after adding or removing source files:
#
#     cd ChatConvexExample && xcodegen generate
#
# The generated project is committed, so xcodegen is only needed when the file
# list changes.

name: ChatConvexExample
options:
  bundleIdPrefix: com.exyte
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ExyteChat:
    path: ..
  MediaPicker:
    url: https://github.com/exyte/MediaPicker.git
    from: 3.4.6
  clerk-ios:
    url: https://github.com/clerk/clerk-ios.git
    from: 1.4.1
  convex-swift:
    url: https://github.com/get-convex/convex-swift.git
    from: 0.8.1
  clerk-convex-swift:
    url: https://github.com/clerk/clerk-convex-swift
    from: 0.1.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  ChatConvexExample:
    type: application
    platform: iOS
    sources:
      - path: ChatConvexExample
        excludes:
          - "Preview Content/**"
      - path: ChatConvexExample/Preview Content
        buildPhase: resources
    configFiles:
      Debug: ChatConvexExample/Config.xcconfig
      Release: ChatConvexExample/Config.xcconfig
    entitlements:
      path: ChatConvexExample/ChatConvexExample.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: ChatConvexExample/Info.plist
      properties:
        # Populated from Config.xcconfig; read back via `AppConfig`.
        ConvexDeploymentURL: $(CONVEX_DEPLOYMENT_URL)
        ClerkPublishableKey: $(CLERK_PUBLISHABLE_KEY)
        GiphyApiKey: $(GIPHY_API_KEY)
        NSCameraUsageDescription: Grant access to camera to be able to take photos and videos
        NSMicrophoneUsageDescription: Grant access to microphone to be able to record voice messages and videos
        NSPhotoLibraryUsageDescription: Grant access to photo library to be able to select photos
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Required, even empty. Without a launch screen key iOS treats the app
        # as pre-iOS-13 and letterboxes it at a legacy aspect ratio, which shows
        # up as black bars above and below the content.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # Swift 5 language mode, matching ChatFirestoreExample's target and
        # ExyteChat's own `swiftLanguageModes: [.v5]`. The ported view models
        # mutate @Published state from Combine subscription callbacks under an
        # NSRecursiveLock, which Swift 6 strict concurrency would reject.
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.exyte.chatConvexExample
        DEVELOPMENT_TEAM: FZXCM5CJ7P
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: '"ChatConvexExample/Preview Content"'
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: ExyteChat
        product: ExyteChat
      - package: clerk-ios
        product: ClerkKit
      - package: clerk-ios
        product: ClerkKitUI
      - package: convex-swift
        product: ConvexMobile
      - package: clerk-convex-swift
        product: ClerkConvex

schemes:
  ChatConvexExample:
    build:
      targets:
        ChatConvexExample: all
    run:
      config: Debug
    archive:
      config: Release
